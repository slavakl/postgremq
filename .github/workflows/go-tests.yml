name: Go Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'postgremq-go/**'
      - 'cmd/postgremq/**'
      - 'mq/**'
      - 'go.work'
      - 'observability/**'
      - 'scripts/release/**'
      - '.github/workflows/go-tests.yml'
  workflow_call:
    inputs:
      ref:
        description: "Commit, branch or tag to test (default: the triggering commit)"
        type: string
        default: ''

jobs:
  test:
    name: Test Go Client
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: ['1.25', '1.26']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-

    # Test the module as published: GOWORK=off, postgremq.dev/mq at the
    # version go.mod requires (from its release tag when released, so go.sum
    # is checked; otherwise from this tree). See scripts/release/go-standalone.sh.
    - name: Run tests
      run: scripts/release/go-standalone.sh postgremq-go go test -v -race -timeout=20m -coverprofile=coverage.out -covermode=atomic ./...

    - name: Test the CLI
      run: scripts/release/go-standalone.sh cmd/postgremq go test ./...

  lint:
    name: Lint Go Code
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    # Workspace mode (go.work): postgremq.dev modules resolve to this tree.
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.12
        working-directory: postgremq-go
        args: --timeout=5m

    - name: Build and vet the CLI and examples
      run: |
        go build ./cmd/postgremq/... ./postgremq-go/examples/...
        go vet ./cmd/postgremq/... ./postgremq-go/examples/...

name: Go Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'postgremq-go/**'
      - 'cmd/postgremq/**'
      - 'mq/**'
      - 'go.work'
      - 'observability/**'
      - '.github/workflows/go-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'postgremq-go/**'
      - 'cmd/postgremq/**'
      - 'mq/**'
      - 'go.work'
      - 'observability/**'
      - '.github/workflows/go-tests.yml'

jobs:
  test:
    name: Test Go Client
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: ['1.25', '1.26']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-

    - name: Download dependencies
      working-directory: ./postgremq-go
      env:
        GOWORK: 'off'
      run: go mod download

    # Test the module as published (its own go.mod), not the workspace:
    # the workspace also holds the metrics example, which needs Go 1.26.
    - name: Run tests
      working-directory: ./postgremq-go
      env:
        GOWORK: 'off'
      run: go test -v -race -timeout=20m -coverprofile=coverage.out -covermode=atomic ./...

    # Uncomment to enable Codecov (requires CODECOV_TOKEN secret)
    # - name: Upload coverage to Codecov
    #   uses: codecov/codecov-action@v4
    #   with:
    #     files: ./postgremq-go/coverage.out
    #     flags: go
    #     name: go-${{ matrix.go-version }}
    #     token: ${{ secrets.CODECOV_TOKEN }}
    #     fail_ci_if_error: false

  lint:
    name: Lint Go Code
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v8
      env:
        GOWORK: 'off'
      with:
        version: v2.12
        working-directory: postgremq-go
        args: --timeout=5m

    - name: Build and vet the CLI and examples
      run: |
        go build ./cmd/postgremq/... ./postgremq-go/examples/...
        go vet ./cmd/postgremq/... ./postgremq-go/examples/...

    - name: Test the CLI
      working-directory: ./cmd/postgremq
      env:
        GOWORK: 'off'
      run: go test ./...

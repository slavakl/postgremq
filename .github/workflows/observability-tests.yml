name: Observability Tests
on:
  push:
    branches: [main]
    paths: ['observability/**', 'mq/**', 'postgremq-go/**', 'postgremq-ts/**', 'postgremq-rs/**', 'docs/observability.md', '.github/workflows/observability-tests.yml']
  pull_request:
    branches: [main]
    paths: ['observability/**', 'mq/**', 'postgremq-go/**', 'postgremq-ts/**', 'postgremq-rs/**', 'docs/observability.md', '.github/workflows/observability-tests.yml']
jobs:
  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: postgremq-ts/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r mq/tests/requirements.txt
      - run: npm ci
        working-directory: postgremq-ts
      - uses: dtolnay/rust-toolchain@1.98
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            postgremq-rs/target
          key: ${{ runner.os }}-cargo-example-${{ hashFiles('postgremq-rs/Cargo.toml', 'postgremq-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-example-
      # Built ahead of the test, so its run fits the test's per-client timeout.
      - run: cargo build --locked --example metrics --features otel
        working-directory: postgremq-rs
      - run: pytest observability/test_collector.py -v

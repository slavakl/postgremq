name: SQL Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'mq/**'
      - '.github/workflows/sql-tests.yml'
  workflow_call:
    inputs:
      ref:
        description: "Commit, branch or tag to test (default: the triggering commit)"
        type: string
        default: ''

jobs:
  test:
    name: Test SQL Implementation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: mq/tests/requirements.txt

    - name: Install dependencies
      working-directory: ./mq
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt

    - name: Run tests
      working-directory: ./mq
      run: pytest tests/tests.py -v --tb=short
